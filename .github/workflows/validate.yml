name: Validate Nantor's Electronics

on:
  push:
    branches:
      - redesign/admin-premium
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate web dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install web dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Generate Cloud Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build
      - name: Test order and stock rules
        working-directory: functions
        run: npm test
